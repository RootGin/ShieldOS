<svg xmlns="http://www.w3.org/2000/svg" width="126" height="20" viewBox="0 0 126 20">
  <defs>
    <linearGradient id="sheen-tab-normal" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="20">
      <stop offset="0" stop-color="{{$surface-control-lit-top}}" />
      <stop offset="1" stop-color="{{$surface-control-lit-bottom}}" />
    </linearGradient>
    <linearGradient id="specular-tab-normal" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="20">
      <stop offset="0" stop-color="{{$specular-rim-top.color}}" stop-opacity="{{$specular-rim-top.opacity}}" />
      <stop offset="1" stop-color="{{$specular-rim-fade.color}}" stop-opacity="{{$specular-rim-fade.opacity}}" />
    </linearGradient>
  </defs>
  <polygon points="0.5,19.5 19.5,0.5 106.5,0.5 125.5,19.5"
           fill="url(#sheen-tab-normal)" stroke="{{$border-panel-outer}}" stroke-width="1" stroke-linejoin="round" />
  <path fill="none" stroke="url(#specular-tab-normal)" stroke-width="1" stroke-linejoin="miter"
        d="M 1.5,19.5 L 19.5,1.5 L 106.5,1.5 L 124.5,19.5" />
