<svg xmlns="http://www.w3.org/2000/svg" width="104" height="45" viewBox="0 0 104 45">
  <!-- Outer chamfered shell with bevel outline -->
  <polygon points="0.5,0.5 57.5,0.5 64.5,7.5 80.5,7.5 103.5,30.5 103.5,44.5 65.5,44.5 58.5,37.5 15.5,37.5 0.5,22.5"
           fill="{{$surface-control}}" stroke="{{$border-panel-outer}}" stroke-width="1" stroke-linejoin="round" />

  <!-- Inset facet on right title plateau -->
  <polygon points="57.5,0.5 64.5,7.5 80.5,7.5 103.5,30.5 103.5,44.5 65.5,44.5 58.5,37.5"
           fill="{{$border-panel-groove}}" fill-opacity="0.25" />

  <!-- Top-left rivet / notch -->
  <rect x="3" y="3" width="2" height="2" fill="{{$border-panel-groove}}" />

  <!-- Contour hairline -->
  <path d="M 16,33.5 L 58,33.5 L 65,40.5 L 103,40.5" stroke="{{$accent-secondary-bright}}" stroke-width="1" stroke-opacity="0.7" fill="none" />

  <!-- Docked amber status badge -->
  <polygon points="78.5,37.5 103.5,37.5 103.5,44.5 71.5,44.5" fill="{{$accent-secondary-bright}}" />
</svg>
